<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root (the daemon) may own the name and change the power limit. -->
  <policy user="root">
    <allow own="org.bruno.GpuPowerMode"/>
  </policy>

  <!-- Any local user may pick a power mode. The only capability exposed is
       the GPU power limit, clamped by the daemon to the card's own
       [min .. rated default] range. Tighten to a specific user= if desired. -->
  <policy context="default">
    <allow send_destination="org.bruno.GpuPowerMode"
           send_interface="org.bruno.GpuPowerMode"/>
    <allow send_destination="org.bruno.GpuPowerMode"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.bruno.GpuPowerMode"
           send_interface="org.freedesktop.DBus.Properties"/>
  </policy>
</busconfig>
